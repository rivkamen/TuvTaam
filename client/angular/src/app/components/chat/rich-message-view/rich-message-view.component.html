<div class="rich-message-wrapper">
  <div class="rich-message-header">
    <h2>✉️ הודעת תיקון</h2>
    <div class="actions">
      <button class="btn" (click)="printPage()">🖨️ הדפס</button>
      <button class="btn" (click)="downloadAsWord()">💾 הורד</button>
      <button class="btn close" (click)="close()">❌ סגור</button>
    </div>
  </div>

  <div class="rich-message-content" [innerHTML]="content"></div>
</div>
