<div class="chat-layout">

<div class="session-list">
  <button *ngFor="let s of sessions"
          class="session-item"
          [class.selected]="s._id === selectedSessionId"
          (click)="selectSession(s._id)">
    <div class="session-title">
  שיחה עם {{ s.userId[0].email || 'לא ידוע' }}

</div>

    <div class="session-dates">
      <div class="hebrew-date">{{ getHebrewDate(s.createdAt) }}</div>
      <div class="gregorian-date">{{ s.createdAt | date: 'dd/MM/yyyy HH:mm' }}</div>
    </div>
  </button>

  <button class="new-session-btn" (click)="startNewSession()">+ שיחה חדשה</button>
</div>

  <!-- צ'אט -->
  <div class="chat-container">
    <br/>
<br/>
    <!-- פרופיל -->
    <div class="user-profile-bar" *ngIf="userEmail">
      <img *ngIf="userPhotoUrl" [src]="userPhotoUrl" class="profile-img" />
      <span class="email">{{ userEmail }}</span>
    </div>

    <!-- יצירת שיחה חדשה -->
    <div *ngIf="newSessionMode" class="new-session-box">
      <input type="text" [(ngModel)]="newSessionTitle" placeholder="שם השיחה (לא חובה)" />
      <textarea [(ngModel)]="newSessionMessage" placeholder="כתוב את ההודעה הראשונה..."></textarea>
       <!-- <p-editor [(ngModel)]="newSessionMessage" [style]="{height:'150px'}" [styleClass]="'custom-editor'"></p-editor> -->
<!-- <p-editor
  [(ngModel)]="newSessionMessage"
  [style]="{height:'200px'}"
  [styleClass]="'custom-editor'"
  [modules]="editorModules"
></p-editor> -->


<p-button label="שליחה" icon="pi pi-send" (click)="sendMessage()" class="p-button-sm p-mt-2" />

      <button (click)="createNewSession()">שלח</button>
      <button (click)="cancelNewSession()">ביטול</button>
    </div>

    <!-- תצוגת שיחה קיימת -->

<br/>
    <div *ngIf="!newSessionMode && selectedSessionId">
      <div *ngIf="loading">טוען הודעות...</div>
     <p-scrollPanel #scrollPanel styleClass="messages-container" [style]="{height: '400px'}">

      <!-- <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="msg.fromUser ? 'user' : 'admin'"> -->
<div *ngFor="let msg of messages; trackBy: trackByMessageId"
     class="message-wrapper" 
     [ngClass]="msg.fromUser ? 'admin' : 'user'">

  <!-- 🧑‍💼 תצוגת פרופיל -->
  <div class="message-profile">
    <img [src]="msg.fromUser ? userPhotoUrl : adminPhotoUrl"
         alt="תמונת פרופיל"
         class="profile-img-small" />
  </div>

<div *ngIf="editMessageId === msg._id; else showMessage" class="edit-message-container">
  <textarea
    pInputTextarea
    [(ngModel)]="editedMessageContent"
    rows="3"
    autoResize="true"
    placeholder="ערוך את ההודעה שלך..."
    class="edit-textarea"
  ></textarea>

  <div class="edit-buttons">
    <button
      pButton
      type="button"
      label="שמירה"
      icon="pi pi-check"
      class="p-button p-button-success save-btn"
      (click)="saveEdit(msg._id)"
    ></button>

    <button
      pButton
      type="button"
      label="ביטול"
      icon="pi pi-times"
      class="p-button p-button-secondary cancel-btn"
      (click)="cancelEdit()"
    ></button>
  </div>
</div>

        <ng-template #showMessage>
          <div class="bubble">
            

<!-- <div *ngIf="msg.content">{{ msg.content }}</div> -->
 <div *ngIf="msg.content" [innerHTML]="msg.content"></div>

   <app-fancy-audio-player
  *ngIf="msg.signedUrl"
  [src]="msg.safeAudioUrl"
  [downloadUrl]="msg.signedUrl">
</app-fancy-audio-player>

</div>
<div class="msg-menu-wrapper" *ngIf="!msg.fromUser" #menuWrapper>
  <button class="menu-toggle-btn" (click)="toggleMenu(msg._id)">⋮</button>
  <div
    class="msg-menu-modern"
    *ngIf="openedMenuId === msg._id"
  >
    <button *ngIf="!msg.signedUrl" class="icon-btn" (click)="startEdit(msg)">
      <i class="pi pi-pencil"></i>
    </button>
    <button class="icon-btn delete" (click)="deleteMessage(msg._id)">
      <i class="pi pi-trash"></i>
    </button>
  </div>
</div>

        </ng-template>
      </div>
</p-scrollPanel>

      <!-- שדה הזנת הודעה -->
      <div class="message-input">
        <input [(ngModel)]="newMessage" placeholder="הקלד הודעה..." (keydown.enter)="sendMessage()" />
        <!-- כפתור התחלת הקלטה -->
<div class="start-recording" *ngIf="!isRecording && !recordedBlob">
  <!-- <button class="icon-btn record" (click)="startRecording()" title="התחל הקלטה"> -->
    <button class="icon-btn record" (click)="openRecordingDialog()" title="התחל הקלטה">

    <i class="pi pi-microphone"></i>
  </button>
</div>

      <button type="button" class="send-btn" (click)="sendMessage()">
        <i class="pi pi-send"></i>
      </button>  </div>    
<app-recording
  *ngIf="isDialogOpen"
  (closed)="closeDialog()"
  (audioRecorded)="handleRecordedAudio($event)"
  class="recording-dialog-overlay"
></app-recording>
