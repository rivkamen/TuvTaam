<div *ngIf="isEditing; else showMessage" class="edit-message-container">

  <!-- עריכה של rich -->
<app-rich-note
  *ngIf="isEditing"
  [sessionId]="sessionId"
  [htmlContent]="localEditedContent"
  (htmlContentChange)="localEditedContent = $event"
  (closed)="cancelEdit()"
  class="note-dialog-overlay">
</app-rich-note>


  <!-- עריכה רגילה -->
  <ng-template #normalEdit>
    <textarea
      pInputTextarea
      [(ngModel)]="localEditedContent"
      rows="3"
      autoResize="true"
      placeholder="ערוך את ההודעה שלך..."
      class="edit-textarea">
    </textarea>

    <div class="edit-buttons">
      <button
        pButton
        type="button"
        label="שמירה"
        icon="pi pi-check"
        class="p-button p-button-success save-btn"
        (click)="saveEdit()">
      </button>

      <button
        pButton
        type="button"
        label="ביטול"
        icon="pi pi-times"
        class="p-button p-button-secondary cancel-btn"
        (click)="cancelEdit()">
      </button>
    </div>
  </ng-template>

</div>

  <!-- תצוגת הודעה רגילה -->
  <ng-template #showMessage>
    
    <!-- שורת שעה וסטטוס "נערכה" -->
    <div class="message-meta">
      <span>{{ message.updatedAt | date:'HH:mm' }}</span>
      <span *ngIf="message.isEdited" class="edited-label">
        | <i class="pi pi-pencil small-icon"></i> נערכה
      </span>
    </div>

    <!-- בועה + תפריט ⋮ בשורה אחת -->
    <div class="message-content-row" (mouseenter)="hoveredMessageId = message._id"
     (mouseleave)="hoveredMessageId = null">
      <!-- בועה -->
      <div class="bubble" [ngClass]="{ 'deleted': message.isDeleted }">
        <div class="word-badge" *ngIf="message.type === 'rich'">
  <i class="pi pi-file-word"></i> Word
</div>

        <ng-container *ngIf="!message.isDeleted; else deletedTemplate">
          <div *ngIf="message.content && message.type !== 'rich'" [innerHTML]="sanitizeMessage(message.content)"></div>
          <div
  *ngIf="message.content && message.type === 'rich'"
  class="rich-message-preview"
  [innerHTML]="sanitizeMessage(message.content)"
  (dblclick)="openRichMessage(message.content)">
</div>

<div *ngIf="message.content && message.type !== 'rich'" [innerHTML]="sanitizeMessage(message.content)">
</div>
  <div
    *ngIf="hoveredMessageId === message._id && message.type === 'rich'"
    class="rich-hint"
  >
    🛈 לצפייה לחץ פעמיים
  </div>
          <app-fancy-audio-player
            *ngIf="message.signedUrl"
            [src]="message.safeAudioUrl"
            [downloadUrl]="message.signedUrl">
          </app-fancy-audio-player>
        </ng-container>
        <ng-template #deletedTemplate>
          <div class="deleted-text">הודעה נמחקה</div>
        </ng-template>
      </div>



      <!-- תפריט הודעה -->
      <div class="msg-menu-wrapper" *ngIf="!message.fromUser && !message.isDeleted" #menuWrapper>
        <button class="menu-toggle-btn" (click)="toggleMenu()">⋮</button>
        <div class="msg-menu-modern" *ngIf="openedMenuId === message._id">
          <button *ngIf="!message.signedUrl" class="icon-btn" (click)="startEdit()">
            <i class="pi pi-pencil"></i>
          </button>
          <button class="icon-btn delete" (click)="deleteMessage()">
            <i class="pi pi-trash"></i>
          </button>
        </div>
      </div>
    </div>
    
  </ng-template>

</div>
<p-dialog
  header="תצוגת הודעת תיקון"
  [(visible)]="showRichViewer"
  [modal]="true"
  [style]="{ width: '70vw', maxHeight: '80vh' }"
  [contentStyle]="{ overflow: 'auto' }"
  [closable]="true"
  [dismissableMask]="true"
  (onHide)="showRichViewer = false">

  <app-rich-message-view
    [rawHtml]="richHtmlContent"
    (closed)="showRichViewer = false">
  </app-rich-message-view>

</p-dialog>
